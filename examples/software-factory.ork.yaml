# yaml-language-server: $schema=https://raw.githubusercontent.com/mimshins/ork/main/packages/schema/workflow.schema.json
schemaVersion: 1
name: software-factory
description: Spec, build, parallel review with a bounded fix loop, an approver, then your go-ahead before the branch is pushed and a pull request opened.
inputs:
  feature:
    type: string
    required: true
    description: The feature to build, in one or two sentences.
layers:
  skills:
    - ./skills/review-checklist
  context:
    - ./context/house-style.md
  project:
    instructions: inherit
    skills: inherit
defaults:
  driver: sdk
  model: sonnet
  isolation: worktree
  budgetUsd: 2
agents:
  spec-writer:
    description: Turns a feature request into a spec a builder can implement.
    instructions: "You write specs. Say what the change must do, what it must not, and how to tell it works: behavior, edge cases and acceptance criteria. Save the spec as a markdown file and report its path as the `spec` artifact."
    model: opus
  builder:
    description: Implements a spec and leads its reviewers through a bounded fix loop.
    instructions: You implement specs. Make the smallest complete change that meets the spec, with tests. Delegate review to the reviewers you own, fix what they find, and report pass only when they do.
    model: opus
  security-reviewer:
    description: Reviews a branch for security issues.
    instructions: "You review for security: injection, secrets, unsafe input handling, permissions and data exposure. Name each problem with its file and line and why it matters. Report changes_requested with the concrete problems, or pass."
    model: opus
    isolation: readonly
  ux-reviewer:
    description: Reviews a branch for the experience of the people who use it.
    instructions: "You review for UX: clear messages, sensible defaults, consistent behavior and accessible output. Report changes_requested with the concrete problems, or pass."
    isolation: readonly
  code-reviewer:
    description: Reviews a branch for code quality.
    instructions: "You review for code quality: correctness, readability, tests and fit with the code around it. Report changes_requested with the concrete problems, or pass."
    isolation: readonly
  approver:
    description: Decides whether a reviewed branch is ready to merge.
    instructions: "You approve merges. Read the branch and its reviews, and decide: approve when it meets its spec and the reviews passed, escalate to a human when anything is doubtful. Say why in your summary."
    model: opus
    isolation: readonly
    output:
      schema:
        verdict:
          - approve
          - escalate
limits:
  budgetUsd: 20
  concurrency: 4
nodes:
  spec:
    type: claude.worker
    agent: spec-writer
    prompt: "Write a spec for: {{inputs.feature}}"
    isolation: shared
  builder:
    type: claude.leader
    agent: builder
    prompt: Implement the spec at {{nodes.spec.output.artifacts.spec}}.
  security:
    type: claude.worker
    parent: builder
    agent: security-reviewer
    prompt: Review the builder's branch for security issues.
  ux:
    type: claude.worker
    parent: builder
    agent: ux-reviewer
    prompt: Review the builder's branch for UX issues.
  code:
    type: claude.worker
    parent: builder
    agent: code-reviewer
    prompt: Review the builder's branch for code quality.
  reviews:
    type: control.join
    mode: all
  approver:
    type: claude.worker
    agent: approver
    prompt: Decide whether {{nodes.builder.output.branch}} is ready to merge.
  ship:
    type: human.gate
    question: The approver approved {{nodes.builder.output.branch}}. Push it and open a pull request?
    options:
      - open
      - keep
    recommended: open
  escalated:
    type: human.gate
    question: "The approver escalated: {{nodes.approver.output.summary}} Push {{nodes.builder.output.branch}} and open a pull request anyway?"
    options:
      - open
      - keep
    recommended: keep
  push:
    type: tool.shell
    command: git push --set-upstream origin {{nodes.builder.output.branch}}
    allow:
      - git push
  pr:
    type: tool.gh
    command: pr create --head {{nodes.builder.output.branch}} --fill
    allow:
      - pr create
edges:
  - spec -> builder
  - builder -> security, ux, code
  - security, ux, code -> reviews
  - from: reviews
    to: builder
    when: any(statuses, 'changes_requested')
    maxRounds: 2
  - from: reviews
    to: approver
    when: all(statuses, 'pass')
  - from: approver
    to: ship
    when: verdict == 'approve'
  - from: approver
    to: escalated
    when: verdict == 'escalate'
  - from: ship
    to: push
    when: choice == 'open'
  - from: escalated
    to: push
    when: choice == 'open'
  - push -> pr
messages:
  - between:
      - security
      - code
