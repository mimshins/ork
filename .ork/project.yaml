# yaml-language-server: $schema=https://raw.githubusercontent.com/mimshins/ork/main/packages/schema/project.schema.json
#
# Ork's own process, as far as project rules express it (AGENTS.md and
# CONTRIBUTING.md are the source; every node reads AGENTS.md through CLAUDE.md):
#
# - The maintainer commits and pushes straight to main, with no pull requests.
#   Ork never commits here (commit: never): a run's work stays uncommitted in a
#   detached worktree started from main, and a workflow's last step is a gate
#   where the maintainer keeps or discards it. Sessions can't commit, push or
#   open a pull request (the deny rules).
# - The commit message (a short imperative subject, a blank line, what changed
#   and why, no AI or agent attribution) is the maintainer's to write: with no
#   Ork commits there is no Ork commit message. The commit-msg hook enforces
#   the no-attribution rule on the maintainer's commit.
# - `pnpm check` is the gate. Project rules have no `verify:` default, so each
#   workflow puts it on its writing nodes.
# - The driver is left to each contributor: a run takes the one ready on the
#   machine (`cli` when both are), or `ork run --driver sdk|cli`.
schemaVersion: 1
git:
  commit: never
  base: main
permissions:
  allow:
    - Bash(pnpm check)
    - Bash(pnpm format)
    - Bash(pnpm format:check)
    - Bash(pnpm lint)
    - Bash(pnpm lint:fix)
    - Bash(pnpm typecheck)
    - Bash(pnpm test)
    - Bash(pnpm docs:check)
    - Bash(pnpm map:check)
    - Bash(pnpm exec oxfmt *)
    - Bash(npx vitest run *)
    - Bash(npx oxlint *)
    - Bash(git status)
    - Bash(git diff *)
    - Bash(git log *)
  deny:
    - Bash(git commit *)
    - Bash(git push *)
    - Bash(gh *)
    - Bash(npm publish *)
    - Bash(pnpm publish *)
    - Bash(changeset publish *)
    - Bash(pnpm changeset publish *)
    - Bash(npx changeset publish *)
    - Bash(ork feedback publish *)
    - Bash(pnpm ork feedback publish *)
defaults:
  model: sonnet
  effort: high
  budgetUsd: 2
  maxTurns: 60
  timeout: 45m
quotas:
  dayUsd: 50
