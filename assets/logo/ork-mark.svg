  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ork-fan-screen)"/>
  <g filter="url(#ork-fan-glow)" fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M 32 19 L 13 47" stroke="#3dff8a"/>
    <path d="M 32 19 V 51" stroke="#3dff8a" opacity="0.8"/>
    <path d="M 32 19 L 51 47" stroke="#24a85a"/>
  </g>
  <g filter="url(#ork-fan-glow)">
    <circle cx="13" cy="47" r="5" fill="#3dff8a"/>
    <circle cx="32" cy="51" r="4.2" fill="#3dff8a" opacity="0.85"/>
    <circle cx="51" cy="47" r="3.6" fill="#24a85a"/>
    <circle cx="32" cy="17" r="8" fill="#ffb000"/>
    <circle cx="32" cy="17" r="3" fill="#e6fff0"/>
  </g>
  <rect width="64" height="64" rx="14" fill="url(#ork-fan-scan)"/>
</svg>
