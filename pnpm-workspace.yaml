packages:
  - packages/*

# Supply chain: a version must have been published for at least 7 days (in
# minutes) before it can be installed.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# The one exception, to exact versions only: fixes to a library by Ork's own
# author, released 2026-11-02. Remove from 2026-11-10 (gap C9).
minimumReleaseAgeExclude:
  - containerized-state@3.3.1
  - containerized-state-plugin-persistence@1.3.0
  - react-containerized-state@3.3.1
# Dependency lifecycle scripts are off. A package may run one only if it is
# listed here with `true`.
allowBuilds: {}
strictDepBuilds: true
# Refuse a version whose trust evidence is weaker than an earlier one's.
trustPolicy: no-downgrade
# Dependencies are saved at an exact version.
savePrefix: ""
