name: Set up the toolchain
description: >-
  Install the pinned pnpm and Node and install the dependencies from the
  lockfile with lifecycle scripts off. Run actions/checkout first.
inputs:
  registry-url:
    description: >-
      The npm registry to authenticate against with NODE_AUTH_TOKEN; set only by
      the release job.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The version comes from the "packageManager" field of package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
