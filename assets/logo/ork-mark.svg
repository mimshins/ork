<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Ork">
  <title>Ork</title>
  <defs>
    <radialGradient id="ork-fan-screen" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#112016"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </radialGradient>
    <filter id="ork-fan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ork-fan-scan" width="4" height="2.5" patternUnits="userSpaceOnUse">
      <rect width="4" height="0.8" fill="#000" opacity="0.16"/>
