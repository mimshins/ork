# yaml-language-server: $schema=https://raw.githubusercontent.com/mimshins/ork/main/packages/schema/workflow.schema.json
schemaVersion: 1
name: build
description: From an approved plan to a change you keep or discard. A leader builds it through the ui-designer, a11y-auditor, implementer or engine agent, and design decisions the plan doesn't settle come to you; three independent reviewers, one per concern, send findings back in a bounded loop; you ratify the decisions made; the docs-keeper syncs the knowledge; then you choose to commit and push to main, commit and push to a branch with a pull request, keep it uncommitted, or discard it. Nothing is committed before that.
inputs:
  plan:
    type: string
    required: true
    description: The approved plan, as markdown. ork run plan or ork run start produces one.
layers:
  context:
    - ../context/build.md
  project:
    instructions: inherit
    skills:
      allow:
        - knowledge-drift-sync
        - resync-map
        - docs-structure
defaults:
  model: claude-code.sonnet
  effort: medium
  budgetUsd: 2
agents:
  conflict-resolver:
    description: Resolves the conflicts of a stopped rebase.
    instructions: |-
      You resolve the conflicts of a git rebase that has stopped, in the checkout you are in.
      - Edit only the files you are told are conflicted. Do not touch any other file, create files, run git, or finish the rebase: Ork stages your files and finishes it.
      - Never drop one side silently. Keep what each side meant to do; when you drop part of one, say which part and why. If the change you are replaying is already in the upstream, say so.
      - Remove every conflict marker (`<<<<<<<`, `=======`, `>>>>>>>`).
      - Report `behaviour: changed` when the result does something other than what the change you are replaying did, or other than what upstream did: the same logic was edited on both sides and you chose, merged or rewrote it. Report `unchanged` when you only kept both sides' separate additions, or took one side's edit of what the other side left alone.
      - In `kept`, say for each file what you kept from the upstream and from the change.
    model: claude-code.sonnet
    effort: medium
    isolation: shared
    budgetUsd: 2
    maxTurns: 30
    tools:
      allow:
        - Edit
        - Write
      only:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
    output:
      schema:
        behaviour:
          - unchanged
          - changed
        kept: string
limits:
  budgetUsd: 50
  concurrency: 4
  timeout: 5h
nodes:
  build:
    type: agent.leader
    prompt: |-
      Build this approved plan through the agents you own. Decide what it needs:
      - UI work (packages/ui): delegate to design first, then the build, then a11y to audit the result.
      - Engine work (scheduler, runtime port and drivers, store and events, run control, replay): delegate the build to engine; anything else to implement.

      Build in waves, following each task's dependencies and files in the plan. Shared contracts (schema, types) go first, as their own wave. Then send each wave as exactly one tool call, so its tasks run at once: your calls run one after another, so a `delegate` and a `spawn_worker` sent together do not overlap. Use `delegate` when each builder in the wave has one task, and otherwise one `spawn_worker` call for the whole wave, naming each task's builder as its template, since a child that is already running refuses another task. Tasks in one wave must not touch the same files, and each must pass pnpm check without another task of its wave. Files everyone appends to (index.ts exports, generated schemas, specs, gaps ids, roadmap data) belong to one task or a last wave. Run tasks together in one builder when they are small or share files: every builder is a new session and its own check, so split only substantial work. But size each brief to fit one session, about 40 turns of work: a builder ends at its turn limit (80), and each time it is sent back it re-reads its whole session, so a brief too large costs more than two smaller ones. Split a task that touches many files or several packages into briefs of a few files each, in order. A merge conflict in a child's report is yours to resolve.

      Each child already has the plan; your brief says which tasks are theirs. Fix only what integrates their work. Ork runs pnpm check on your checkout before your report counts. When you run again, your input is either the independent reviews (`results` holds each concern's blocking `findings`, which are yours to fix, and its `notes`, which never block: leave them unless a fix is trivial, and `statuses` its verdict, in the order of `items`; a `fail` is a reviewer that didn't finish, with nothing for you to fix), or the maintainer's answer at the ratify gate (choice revise, and note, their words on what to change): delegate the fixes. If that note is empty, ask with ask_user what to change rather than guessing. When a child asks a question, answer it only when the approved plan or an earlier answer settles it, and say which. A design decision the plan doesn't settle always takes the pass-on option, so it reaches the maintainer. Never decide one for them. Say in `unchecked` what no child and no check covered (an empty string when nothing). Report pass only when every child you used passed, and gather the entries of the plan's Decided section, copying each one's hardToReverse as written, and every decision your children reported into your own `decisions`, keeping who decided each. Ork keeps the decisions of your earlier rounds, so when you run again, report the ones made in this round.

      {{inputs.plan}}
    model: claude-code.sonnet
    effort: high
    isolation: worktree
    budgetUsd: 4
    maxTurns: 60
    timeout: 3h
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        decisions:
          type: array
          description: Every entry of the plan's Decided section and every decision of each child you used, gathered, with its decidedBy kept; in a later round, only that round's. Ork keeps every round's. An empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
        unchecked: string
      gather:
        - decisions
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 1
    maxWorkers: 8
    questions: owner
  design:
    type: agent.worker
    parent: build
    agent: ui-designer
    prompt: |-
      Design the UI part of this task before it is coded, as your owner's brief says. Write the design (purpose, states, tokens, keyboard map, accessible names, copy word for word) into specs/ui/ and any new tokens into packages/ui/src/design/, with their pairings in packages/ui/test/pairings.ts. Write no feature code. A design decision this plan doesn't settle goes to ask_user, with options and a recommendation, before you build it; never choose it yourself. Report every choice you made that the plan didn't settle in `decisions`. Change files with Edit and Write. In Bash keep to plain read commands (cat, head, tail, wc, ls, grep, rg, sed -n, cut, sort, uniq, echo, read-only git), one command per call, with no cd (you are already in the checkout), no loops, no shell variables, no redirects and no files outside this checkout, not even in /tmp: anything else stops the run to ask the maintainer. The approved plan:

      {{inputs.plan}}
    model: claude-code.sonnet
    effort: high
    isolation: worktree
    budgetUsd: 3
    maxTurns: 40
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the plan didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    mcp:
      - chrome-devtools
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
  a11y:
    type: agent.worker
    parent: build
    agent: a11y-auditor
    prompt: Audit the uncommitted UI change in your owner's checkout (git status, git diff HEAD) against WCAG 2.2 AA. Open the changed surfaces in the browser tools for axe, a keyboard pass, zoom and contrast, and audit the changed components' markup, names and roles, focus handling, keyboard map, tokens and their contrast pairings, and run the UI's tests (npx vitest run packages/ui). Report pass, or changes_requested with every finding in `findings` (surface, criterion, how it fails, the fix), and list anything you couldn't check. In Bash keep to plain read commands (cat, head, tail, wc, ls, grep, rg, sed -n, cut, sort, uniq, echo, read-only git), the tests and pnpm install --offline, one command per call, with no cd (you are already in the checkout), no awk, find, python, loops, shell variables, brace expansion, redirects or paths outside this checkout, and write no files, not even a temporary test or one in /tmp. Anything else stops the run to ask the maintainer. What needs more than that goes in the list of what you couldn't check.
    model: claude-code.sonnet
    isolation: readonly
    budgetUsd: 2
    maxTurns: 40
    tools:
      allow:
        - Bash(pnpm install --offline *)
    session: resume
    output:
      schema:
        findings: string
    mcp:
      - chrome-devtools
  implement:
    type: agent.worker
    parent: build
    agent: implementer
    prompt: |-
      Build the tasks your owner's brief gives you from this approved plan. If a design is in your checkout (git status), build to it. A design decision this plan doesn't settle goes to ask_user, with options and a recommendation, before you build it; never choose it yourself. Report every other choice you made that the plan didn't settle in `decisions`. Ork runs `pnpm check:changed` (the static checks and the tests your change reaches) before your report counts.

      {{inputs.plan}}
    effort: high
    isolation: worktree
    budgetUsd: 6
    maxTurns: 80
    timeout: 90m
    tools:
      allow:
        - Edit
        - Write
        - Bash
    session: resume
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the plan didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check:changed
      timeout: 20m
      attempts: 2
  engine:
    type: agent.worker
    parent: build
    agent: engine
    prompt: |-
      Build the tasks your owner's brief gives you from this approved plan. If a design is in your checkout (git status), build to it. A design decision this plan doesn't settle goes to ask_user, with options and a recommendation, before you build it; never choose it yourself. The engine's semantics are always a design decision. Report every other choice you made that the plan didn't settle in `decisions`. Ork runs `pnpm check:changed` (the static checks and the tests your change reaches) before your report counts.

      {{inputs.plan}}
    model: claude-code.opus
    effort: high
    isolation: worktree
    budgetUsd: 8
    maxTurns: 80
    timeout: 90m
    tools:
      allow:
        - Edit
        - Write
        - Bash
    session: resume
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the plan didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check:changed
      timeout: 20m
      attempts: 2
  review:
    type: agent.worker
    agent: reviewer
    prompt: |-
      Review the uncommitted change in this checkout (git status, git diff HEAD) against the approved plan below, for one concern only; two other reviewers cover the rest. pnpm check already passed here; don't run it again.

      Your concern, {{item.concern}}: {{item.look}}

      Start `summary` with your concern's name. A finding is blocking when it is a bug, an acceptance criterion with no test that would fail without the change, or a rule AGENTS.md makes mandatory; put those in `findings` (file:line, what is wrong, the smallest fix), most severe first, and report changes_requested. Put everything else (style, naming, a better way, a nice-to-have) in `notes`, and report pass when only notes remain: notes never send the work back. Read every changed source file and test body your concern touches, in full; your limits allow it, so don't stop to economise. List in `unchecked` what your concern touches that you didn't read or couldn't check (an empty string when nothing). When you run again, don't review the whole change again: check each of your earlier blocking findings at its place and in what was changed for it, then read what your last `unchecked` listed; re-read other files only where those fixes reach.

      In Bash you may also run npm view.

      {{inputs.plan}}
    model: "{{item.model}}"
    effort: high
    context:
      - ../context/read-only-bash.md
    isolation: readonly
    budgetUsd: 2
    maxTurns: 40
    session: resume
    output:
      schema:
        findings: string
        notes: string
        unchecked: string
    forEach:
      items:
        - concern: correctness
          model: claude-code.opus
          look: "bugs and behaviour: does the code do what the plan says, including failure paths, races, resume and edge cases."
        - concern: tests
          model: claude-code.sonnet
          look: does each acceptance criterion have a test that would fail without the change, and do the tests assert behaviour rather than the implementation.
        - concern: repository rules
          model: claude-code.sonnet
          look: "the rules in AGENTS.md: dependency direction, entry points, @file blocks, stale specs and user docs, the interaction map and roadmap, gaps, changesets, secrets, and AI attribution."
      maxParallel: 3
  followups:
    type: agent.worker
    prompt: |-
      The change in this checkout passed review. List what it leaves for later: follow-ups (work about the product, apart from feedback about Ork or its workflows) and insights (things learned that are not work). Read, never edit.

      Sources: the reviewers' `notes` and `unchecked` below, the build leader's `unchecked`, and the decisions. Read the changed code only to judge an item. Merge duplicates into one item. Leave out what the change already did and what a blocking finding covered.

      Each item: `title`, `body` (what and why, short), `for` (`agent`: a later run of this project; `project:<name>`: an agent in another registered project; `me`: the maintainer; `person:<name>`), `kind` (`change`, `message`, `task` or `check`), `due` (`now`, `after-merge`, `after-deploy` or a date as YYYY-MM-DD), `where` (the files, empty when none), `size` (`trivial`, `real` or `not-worth-it`) and `recommend`:
      - `do`: only for `for: agent`, `kind: change`, `due: now`, and `size` trivial or real: the run can do it now.
      - `drop`: for `not-worth-it` items (style nits, a taste, a nice-to-have).
      - `defer`: everything else.

      `itemCount` is how many items you report, and `doCount` how many recommend `do`. `insights` is what the docs node should write into the specs and memories (a trap found, how something really behaves, a convention); never an item, and an empty string when there are none. Report an empty `items` when nothing is left: the maintainer is then not asked.

      Review, concern by concern (`notes` and `unchecked` are yours to read; `findings` are already fixed):
      {{nodes.review.output.results}}

      The build leader's `unchecked`:
      {{nodes.build.output.unchecked}}

      The decisions:
      {{nodes.build.output.decisions}}
    effort: medium
    isolation: readonly
    budgetUsd: 0.5
    maxTurns: 20
    output:
      schema:
        items:
          type: array
          description: What the change leaves for later; an empty list when nothing.
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - body
              - for
              - kind
              - due
              - size
              - recommend
            properties:
              title:
                type: string
              body:
                type: string
              for:
                type: string
                description: agent, project:<name>, me or person:<name>.
              kind:
                type: string
                enum:
                  - change
                  - message
                  - task
                  - check
              due:
                type: string
                description: now, after-merge, after-deploy or a date.
              where:
                type: string
              size:
                type: string
                enum:
                  - trivial
                  - real
                  - not-worth-it
              recommend:
                type: string
                enum:
                  - do
                  - defer
                  - drop
        itemCount: integer
        doCount: integer
        insights: string
  followup-gate:
    type: human.gate
    question: |-
      The change leaves follow-ups. What should happen to them? Nothing is deferred or dropped until you choose.

      - take-recommended: do the ones marked do now in this run, defer the ones marked defer (they are added to the project's follow-ups once the change is published) and drop the ones marked drop.
      - defer-all: defer every one.
      - choose-each: decide item by item.

      Only agent follow-ups due now can be done in this run. Read the document for each item.
    document: |-
      ## Follow-ups

      {{nodes.followups.output.items}}

      ## Insights for the docs

      {{nodes.followups.output.insights}}
    options:
      - take-recommended
      - defer-all
      - choose-each
    recommended: take-recommended
  followup-pick:
    type: agent.worker
    prompt: |-
      Ask the maintainer what to do with each follow-up below, one `ask_user` per item, in order. Give the question the item's title, body, `for`, `kind`, `due` and `size`. The options are `defer` and `drop`, and `do` first when the item is `for: agent` with `due: now`; `recommended` is the item's `recommend`. Never answer for the maintainer, and never skip an item. Write nothing.

      Report `decisions` (each item's `title` and the maintainer's `choice`) and `doCount`, how many are `do`.

      {{nodes.followups.output.items}}
    effort: low
    isolation: readonly
    budgetUsd: 0.3
    maxTurns: 30
    output:
      schema:
        decisions:
          type: array
          description: The maintainer's choice for each item, in order.
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - choice
            properties:
              title:
                type: string
              choice:
                type: string
                enum:
                  - do
                  - defer
                  - drop
        doCount: integer
  polish:
    type: agent.worker
    agent: implementer
    prompt: |-
      Do the follow-ups the maintainer chose to do now, in this checkout, in one round: only the items below, with the smallest change that fully does each. Do not defer, drop or send anything yourself. An item you cannot do goes in `skipped` with the reason; the maintainer sees it. Ork runs `pnpm check` on your checkout before your report counts.

      Report `done` (the title and `size` of each item you did), `realDone` (true when any item you did is `real`) and `fixedReview` (true only when you ran again to fix the correctness review's findings, false on your first run).

      The maintainer chose "{{nodes.followup-gate.output.choice}}". On take-recommended, the items to do are those below with `recommend: do`. On choose-each, they are those the answers below mark `do`.

      The items:
      {{nodes.followups.output.items}}

      The answers, item by item:
      {{nodes.followup-pick.output.decisions}}

      When you run again, the next message is the correctness review of your work: fix what it blocks on, and report `done`, `realDone` and `fixedReview: true`.
    effort: medium
    isolation: continue
    budgetUsd: 3
    maxTurns: 40
    tools:
      allow:
        - Edit
        - Write
        - Bash
    session: resume
    output:
      schema:
        done:
          type: array
          description: Each item you did.
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - size
            properties:
              title:
                type: string
              size:
                type: string
                enum:
                  - trivial
                  - real
        realDone: boolean
        fixedReview: boolean
        skipped: string
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 1
  polish-review:
    type: agent.worker
    agent: reviewer
    prompt: |-
      Review, for correctness only (bugs and behaviour, failure paths and edge cases), the follow-ups just done in this checkout (git status, git diff HEAD). Look only at the code those items changed; the rest passed review already. pnpm check already passed here; don't run it again.

      The items done: {{nodes.polish.output.done}}

      A finding is blocking when it is a bug. Put those in `findings` (file:line, what is wrong, the smallest fix) and report changes_requested; put everything else in `notes` and report pass. List in `unchecked` what you didn't read or couldn't check (an empty string when nothing).
    effort: high
    context:
      - ../context/read-only-bash.md
    isolation: readonly
    budgetUsd: 1.5
    maxTurns: 30
    session: resume
    output:
      schema:
        findings: string
        notes: string
        unchecked: string
  ratify:
    type: human.gate
    question: |-
      Ratify the decisions made during this build? ADRs are written next, from the ones marked hardToReverse.

      Look for hardToReverse entries where decidedBy is not maintainer: an agent made those.

      - continue: accept them all and go on to the docs.
      - revise: send your note to the build leader to change them.
      - stop: end the run. The change stays in its worktree.
    document: |-
      ## Decisions made during the build

      {{nodes.build.output.decisions}}

      ## Review

      {{nodes.review.output.results}}

      ## Follow-ups

      What the change leaves for later, as reported (empty when nothing):

      {{nodes.followups.output.items}}

      Your choice: {{nodes.followup-gate.output.choice}}. take-recommended did the items marked do, deferred those marked defer and dropped those marked drop; defer-all defers every one; choose-each follows your answers: {{nodes.followup-pick.output.decisions}}

      Done in this run: {{nodes.polish.output.done}}

      Chosen to do and not done: {{nodes.polish.output.skipped}}

      Correctness review of those: {{nodes.polish-review.output.summary}}

      Deferred items are added to the project's follow-ups once the change is published, and dropped ones are not kept.
    options:
      - continue
      - revise
      - stop
  docs:
    type: agent.worker
    agent: docs-keeper
    prompt: |-
      The change in this checkout (git status, git diff HEAD) passed review. Sync the knowledge with it: run knowledge-drift-sync, resync-map when it changes what the map shows, and docs-structure for any document over 200 lines.

      Then write an ADR in decisions/ for each decision below with hardToReverse true, from .ai/templates/adr.md: the next free number, a row in decisions/README.md's index, and links to the specs under specs/ that carry it (the plan is gitignored, so don't link it). Related decisions may share one ADR; a decision listed twice is one. List every ADR you wrote in `adrs`, an empty list when none.

      If the plan has a line `Closes RFC: RFC-NNN`, run `pnpm rfc:close RFC-NNN` first: it marks the RFC Implemented, moves it to rfcs/archived/ and updates the index. Then write one ADR for that RFC and link the two both ways. If the script says the RFC isn't in rfcs/active/, leave it, and say so in your summary so the maintainer can close it later. Without that line, leave RFCs alone: an RFC can span several runs.

      The follow-ups review found these insights (empty when none): things learned that are not work. Write each into the spec or memory it belongs to, and never as a follow-up.

      {{nodes.followups.output.insights}}

      Make sure the change has a changeset in .changeset/ (a Markdown file naming the bump for @krapht/ork and a changelog line; `pnpm changesets:empty` for internal-only work), and add one if it doesn't. A commit step refuses a change without one.

      Then write the commit message for the whole change: `commitSubject`, a short imperative subject with no prefix (like "Let Claude nodes name the MCP servers they load"), and `commitBody`, what changed and why in a few lines. No AI or agent attribution. Ork runs pnpm check before your report counts.

      The build's decisions: {{nodes.build.output.decisions}}

      The approved plan:

      {{inputs.plan}}
    isolation: continue
    budgetUsd: 2
    maxTurns: 60
    practices:
      caveman: false
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        commitSubject: string
        commitBody: string
        adrs:
          type: array
          description: Every ADR you wrote; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - path
            properties:
              title:
                type: string
              path:
                type: string
    verify:
      command: pnpm check:changed
      timeout: 20m
      attempts: 1
  stage:
    type: tool.git
    command: add -A
    allow:
      - add
    cwd: "{{nodes.docs.output.worktree}}"
  decide:
    type: human.gate
    question: |-
      Where does this change go? Nothing is committed yet.

      - main: commit it and push to main.
      - branch: commit it, push to the branch your note names (no note: ork/<run>) and open a pull request to main.
      - keep-uncommitted: apply it to your checkout for you to commit.
      - discard: leave it in the worktree (ork worktrees remove <run>/<node> --force removes it).

      Read the document for what was built, the review, and the commit message.
    document: |-
      ## What was built

      {{nodes.build.output.summary}}

      Docs: {{nodes.docs.output.summary}}

      Worktree: {{nodes.docs.output.worktree}}

      ## Review

      Verdicts of correctness, tests and repository rules, in that order: {{nodes.review.output.statuses}}

      Each concern's summary, findings left open and what it didn't check:

      {{nodes.review.output.results}}

      ## What wasn't checked

      Build: {{nodes.build.output.unchecked}}

      ## ADRs

      Check these before you keep the change:

      {{nodes.docs.output.adrs}}

      ## Commit message

      {{nodes.docs.output.commitSubject}}

      {{nodes.docs.output.commitBody}}

      ## Files changed

      {{nodes.stage.output.staged}}
    options:
      - main
      - branch
      - keep-uncommitted
      - discard
  publish:
    type: tool.shell
    script: |-
      set -eu
      if [ "$CHOICE" = main ]; then
        branch=main
      else
        branch="$(printf %s "$NOTE" | tr -d '[:space:]')"
        branch="${branch:-ork/$RUN}"
      fi
      if ! git check-ref-format --branch "$branch" > /dev/null 2>&1; then
        echo "'$branch' is not a valid branch name. The change is still in $WORKTREE." >&2
        exit 1
      fi
      if [ "$CHOICE" = branch ] && [ "$branch" = main ]; then
        echo "Choose main to push to main; branch opens a pull request from another branch." >&2
        exit 1
      fi
      # A try that stopped in the resolver left its rebase open: start the rebase over.
      gitdir="$(git -C "$WORKTREE" rev-parse --absolute-git-dir)"
      if [ -d "$gitdir/rebase-merge" ] || [ -d "$gitdir/rebase-apply" ]; then
        git -C "$WORKTREE" rebase --abort
      fi
      # Already committed when an earlier try stopped at the rebase or the push.
      if ! git -C "$WORKTREE" diff --cached --quiet; then
        if ! git -C "$WORKTREE" diff --cached --name-only --diff-filter=AM -- .changeset | grep -q '\.md$'; then
          echo "No changeset in this change. Add one in $WORKTREE (pnpm changesets:create or changesets:empty), stage it, and resume." >&2
          exit 1
        fi
        printf '%s\n\n%s\n' "$SUBJECT" "$BODY" | git -C "$WORKTREE" commit -F - > /dev/null
      fi
      base=main
      if git -C "$WORKTREE" ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
        base="$branch"
      fi
      git -C "$WORKTREE" fetch origin "$base"
      # Left open on a conflict: the resolver below continues it.
      if git -C "$WORKTREE" rebase FETCH_HEAD > /dev/null 2>&1; then
        outcome=clean
      elif [ -n "$(git -C "$WORKTREE" diff --name-only --diff-filter=U)" ]; then
        outcome=conflict
      else
        git -C "$WORKTREE" rebase --abort || true
        echo "The rebase onto origin/$base failed without a conflict. The change is committed in $WORKTREE; rebase it there and push." >&2
        exit 1
      fi
      printf '{"outcome":"%s","branch":"%s"}\n' "$outcome" "$branch"
    allow:
      - sh
    env:
      CHOICE: "{{nodes.decide.output.choice}}"
      NOTE: "{{nodes.decide.output.note}}"
      RUN: "{{run.id}}"
      SUBJECT: "{{nodes.docs.output.commitSubject}}"
      BODY: "{{nodes.docs.output.commitBody}}"
      WORKTREE: "{{nodes.docs.output.worktree}}"
    output:
      format: json
      schema:
        outcome:
          - clean
          - conflict
        branch: string
    lock: branch:main
  inspect:
    type: tool.shell
    script: |-
      gitdir=$(git rev-parse --absolute-git-dir)
      if [ ! -d "$gitdir/rebase-merge" ] && [ ! -d "$gitdir/rebase-apply" ]; then
        echo "No rebase is in progress here, so there is nothing to resolve." >&2
        exit 1
      fi
      files=$(git diff --name-only --diff-filter=U)
      if [ -z "$files" ]; then
        echo "The rebase has no conflicted files: finish it with git rebase --continue." >&2
        exit 1
      fi
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      stage() { git show ":$1:$2" > "$3" 2> /dev/null || : > "$3"; }
      change=$(git log -1 --format=%s REBASE_HEAD 2> /dev/null || echo "the commit being replayed")
      printf '%s\n' "$files" > "$tmp/files"
      : > "$tmp/sides"
      while IFS= read -r f; do
        stage 1 "$f" "$tmp/base"
        stage 2 "$f" "$tmp/upstream"
        stage 3 "$f" "$tmp/change"
        {
          printf '== %s ==\n-- what the upstream changed --\n' "$f"
          diff -u -L base -L upstream "$tmp/base" "$tmp/upstream" || true
          printf -- '-- what the change (%s) did --\n' "$change"
          diff -u -L base -L change "$tmp/base" "$tmp/change" || true
          printf '\n'
        } >> "$tmp/sides"
      done < "$tmp/files"
      esc() { tr '\000-\011\013-\037' ' ' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk 'BEGIN { ORS = "\\n" } { print }'; }
      printf '{"files":"%s","sides":"%s"}\n' "$(esc < "$tmp/files")" "$(esc < "$tmp/sides")"
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    output:
      format: json
      schema:
        files: string
        sides: string
    lock: branch:main
  resolve:
    type: agent.worker
    agent: conflict-resolver
    prompt: |-
      A rebase stopped on conflicts. Resolve them in this checkout.

      The conflicted files, and only these may be edited:
      {{nodes.inspect.output.json.files}}

      What each side did to them. The upstream is what the rebase is going onto; the change is the commit being replayed:
      {{nodes.inspect.output.json.sides}}
    isolation: continue
    lock: branch:main
  settle:
    type: tool.shell
    script: |-
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      printf '%s\n' "$FILES" | sed '/^$/d' > "$tmp/files"
      while IFS= read -r f; do
        if [ -f "$f" ] && grep -Eq '^(<<<<<<<|>>>>>>>) ' "$f"; then
          echo "$f still has conflict markers." >&2
          exit 1
        fi
      done < "$tmp/files"
      { git diff --name-only; git ls-files --others --exclude-standard -- . ':!.ork'; } > "$tmp/touched"
      while IFS= read -r f; do
        if ! grep -Fxq -- "$f" "$tmp/files"; then
          echo "$f was changed but is not in the conflict. The resolver may edit only the conflicted files." >&2
          exit 1
        fi
      done < "$tmp/touched"
      while IFS= read -r f; do
        git add -A -- "$f"
      done < "$tmp/files"
      esc() { tr '\000-\011\013-\037' ' ' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk 'BEGIN { ORS = "\\n" } { print }'; }
      : > "$tmp/result"
      while IFS= read -r f; do
        git diff --cached -- "$f" >> "$tmp/result"
      done < "$tmp/files"
      printf '{"behaviour":"%s","result":"%s"}\n' "$BEHAVIOUR" "$(esc < "$tmp/result")"
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    env:
      BEHAVIOUR: "{{nodes.resolve.output.behaviour}}"
      FILES: "{{nodes.inspect.output.json.files}}"
    output:
      format: json
      schema:
        behaviour:
          - unchanged
          - changed
        result: string
    lock: branch:main
  ask:
    type: human.gate
    question: "The resolution changes what a reviewed change does: the same logic was edited on both sides. Keep it and finish the rebase, or stop with the work left in the checkout?"
    document: |-
      What each side did:
      {{nodes.inspect.output.json.sides}}
      What the resolver kept from each side:
      {{nodes.resolve.output.kept}}

      The result:
      {{nodes.settle.output.json.result}}
    options:
      - keep
      - stop
    recommended: stop
  stop:
    type: tool.shell
    script: |-
      echo "Stopped at your answer. The rebase is still in progress in this checkout, with the resolution staged." >&2
      exit 1
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    lock: branch:main
  finish:
    type: tool.shell
    script: |-
      export GIT_EDITOR=true
      # A resolution that leaves nothing to commit means the change is already upstream.
      if git diff --cached --quiet; then
        git rebase --skip || true
      else
        git rebase --continue || true
      fi
      gitdir=$(git rev-parse --absolute-git-dir)
      if [ -d "$gitdir/rebase-merge" ] || [ -d "$gitdir/rebase-apply" ]; then
        echo "The rebase stopped again, on the next commit. Its conflict is in this checkout." >&2
        exit 1
      fi
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    lock: branch:main
  check:
    type: tool.shell
    script: |-
      # On a failure, the end of the output goes to stderr for repair.
      log=$(mktemp)
      trap 'rm -f "$log"' EXIT
      if pnpm run check > "$log" 2>&1; then
        exit 0
      fi
      grep -v -e "HTMLCanvasElement's getContext" -e "not configured to support act" "$log" | tail -n 150 >&2
      exit 1
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    timeout: 30m
    lock: branch:main
  repair:
    type: agent.worker
    prompt: |-
      The reviewed change was rebased onto main and committed in this checkout, and then `pnpm check` failed on it. Fix what fails, and nothing else.

      Most such failures come from two changes that were each fine alone: a gap id that both took (give this change's entries the next free ids, update every link to them and the next id in specs/gaps.md), a document the two together push over 200 lines (tighten it, or split it into a hub and chunks), or a test the other change broke. What main already has stays as it is: change this change's side. Keep what the reviewed change does; when a fix would change that, report fail and say why, and the maintainer decides.

      Ork runs the check again after you. Run no git: Ork amends the commit with what you change.

      The end of the check's output:
      {{nodes.check.output.stderr}}
    isolation: continue
    budgetUsd: 3
    maxTurns: 60
    tools:
      allow:
        - Edit
        - Write
        - Bash
    lock: branch:main
  amend:
    type: tool.shell
    script: |-
      git add -A -- . ':!.ork'
      if git diff --cached --quiet; then
        echo "The repair changed nothing, so the check would fail the same way." >&2
        exit 1
      fi
      git commit -q --amend --no-edit
      git show --stat --format= HEAD | tail -n 1
    allow:
      - sh
    cwd: "{{nodes.docs.output.worktree}}"
    lock: branch:main
  push:
    type: tool.shell
    script: |-
      set -eu
      # The check ran in the step before, not in the pre-push hook: git connects
      # before the hook, and GitHub drops the idle connection while the hook runs (exit 141).
      if ! out=$(git -C "$WORKTREE" push --no-verify origin "HEAD:refs/heads/$BRANCH" 2>&1); then
        printf '%s\n' "$out" >&2
        case "$out" in
          *"[rejected]"* | *non-fast-forward* | *"fetch first"*)
            # The branch moved since the rebase: publish rebases again, and the check runs again.
            echo "origin/$BRANCH moved since the rebase; rebasing again."
            printf '{"outcome":"behind"}\n' > "$ORK_OUTPUT"
            exit 0
            ;;
        esac
        exit 1
      fi
      printf '%s\n' "$out"
      printf '{"outcome":"pushed"}\n' > "$ORK_OUTPUT"
      if [ "$CHOICE" = branch ]; then
        if gh pr view "$BRANCH" > /dev/null 2>&1; then
          echo "$BRANCH already has a pull request; it is updated."
        else
          gh pr create --base main --head "$BRANCH" --title "$SUBJECT" --body "$BODY"
        fi
      elif [ "$(git branch --show-current)" = main ] && [ -z "$(git status --porcelain)" ]; then
        git fetch origin main
        git merge --ff-only FETCH_HEAD
      else
        echo "Pushed to main. Your checkout has other work or another branch, so it was left alone: git pull when ready."
      fi
    allow:
      - sh
    env:
      BRANCH: "{{nodes.publish.output.json.branch}}"
      CHOICE: "{{nodes.decide.output.choice}}"
      SUBJECT: "{{nodes.docs.output.commitSubject}}"
      BODY: "{{nodes.docs.output.commitBody}}"
      WORKTREE: "{{nodes.docs.output.worktree}}"
    output:
      format: json
      schema:
        outcome:
          - pushed
          - behind
    lock: branch:main
  apply:
    type: tool.shell
    script: |-
      patch="$(mktemp)"
      git -C "$WORKTREE" diff --cached --binary > "$patch"
      git apply --check "$patch"
      git apply "$patch"
      git apply --stat "$patch"
      rm -f "$patch"
    allow:
      - sh
    env:
      WORKTREE: "{{nodes.docs.output.worktree}}"
  published:
    type: tool.shell
    script: |-
      # The change is already pushed: a failure here only means the follow-ups don't know it yet.
      ork follow-ups published "$BRANCH" || echo "Could not record $BRANCH for the follow-ups; run: ork follow-ups published $BRANCH" >&2
    allow:
      - sh
    env:
      BRANCH: "{{nodes.publish.output.json.branch}}"
  declare:
    type: agent.worker
    prompt: |-
      The change is published (or kept for the maintainer). Record what it leaves for later with the `follow_up` tool, one call per follow-up, and nothing else. Never run a command, edit a file or send anything.

      Add:
      1. Each follow-up under the plan's `Follow-ups` section, if it has one.
      2. Each item below the maintainer chose to defer: with take-recommended, the items marked `recommend: defer`; with defer-all, every item; with choose-each, the items their answers mark `defer`. Never add an item marked drop or one that was done.

      Give each its `title`, `body`, `for`, `kind`, `due` and `where` as written. The maintainer chose "{{nodes.decide.output.choice}}": on branch, set `ref` to `{{nodes.publish.output.json.branch}}` so an `after-merge` follow-up becomes due when it merges; on main the change is already merged, so set `due` to `now` for an `after-merge` follow-up; on keep-uncommitted set no `ref`. Say in your summary how many you added and how many merged into one already there.

      The items:
      {{nodes.followups.output.items}}

      The maintainer chose "{{nodes.followup-gate.output.choice}}" for them. The answers, item by item:
      {{nodes.followup-pick.output.decisions}}

      The approved plan:

      {{inputs.plan}}
    effort: low
    isolation: readonly
    budgetUsd: 0.5
    maxTurns: 30
edges:
  - build -> review
  - from: review
    to: build
    when: "!all(statuses, 'pass')"
    maxRounds: 3
  - from: review
    to: followups
    when: all(statuses, 'pass')
  - from: followups
    to: ratify
    when: "!(itemCount > 0)"
  - from: followups
    to: followup-gate
    when: itemCount > 0
  - from: followup-gate
    to: polish
    when: choice == 'take-recommended' && nodes.followups.output.doCount > 0
  - from: followup-gate
    to: ratify
    when: choice == 'defer-all' || (choice == 'take-recommended' && !(nodes.followups.output.doCount > 0))
  - from: followup-gate
    to: followup-pick
    when: choice == 'choose-each'
  - from: followup-pick
    to: polish
    when: doCount > 0
  - from: followup-pick
    to: ratify
    when: "!(doCount > 0)"
  - from: polish
    to: polish-review
    when: realDone
  - from: polish
    to: ratify
    when: "!realDone"
  - from: polish-review
    to: polish
    when: status == 'changes_requested' && !nodes.polish.output.fixedReview
    maxRounds: 1
  - from: polish-review
    to: ratify
    when: status != 'changes_requested' || nodes.polish.output.fixedReview
  - from: ratify
    to: docs
    when: choice == 'continue'
  - from: ratify
    to: build
    when: choice == 'revise'
    maxRounds: 2
  - docs -> stage
  - stage -> decide
  - from: decide
    to: publish
    when: choice == 'main' || choice == 'branch'
  - from: decide
    to: apply
    when: choice == 'keep-uncommitted'
  - from: publish
    to: check
    when: json.outcome == 'clean'
  - from: publish
    to: inspect
    when: json.outcome == 'conflict'
  - inspect -> resolve
  - from: docs
    to: resolve
    when: ok && !ok
  - resolve -> settle
  - from: settle
    to: ask
    when: json.behaviour == 'changed'
  - from: settle
    to: finish
    when: json.behaviour == 'unchanged'
  - from: ask
    to: finish
    when: choice == 'keep'
  - from: ask
    to: stop
    when: choice == 'stop'
  - finish -> check
  - check -> push
  - from: check
    to: repair
    when: "!ok"
  - from: docs
    to: repair
    when: ok && !ok
  - repair -> amend
  - from: amend
    to: check
    maxRounds: 2
  - from: push
    to: published
    when: json.outcome == 'pushed'
  - from: push
    to: publish
    when: json.outcome == 'behind'
    maxRounds: 3
  - published -> declare
  - apply -> declare
