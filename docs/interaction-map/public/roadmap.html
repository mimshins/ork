<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ork Roadmap</title>
    <meta
      name="description"
      content="Ork's milestones, what each holds, what has shipped and when, and what is left."
    />
    <link
      rel="icon"
      href="favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="css/tokens.css"
    />
    <link
      rel="stylesheet"
      href="css/styles.css"
    />
    <link
      rel="stylesheet"
      href="css/roadmap.css"
    />
    <script src="js/theme-init.js"></script>
    <script
      type="module"
      src="js/roadmap.js"
    ></script>
  </head>
  <body class="roadmap-page">
    <header class="rm-top">
      <a
        class="brand"
        href="index.html"
        title="Interaction map"
      >
        <svg
          class="logo"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="3"
            width="11"
            height="11"
            rx="3.5"
            class="l1"
          />
          <rect
            x="18"
            y="3"
            width="11"
            height="11"
            rx="3.5"
            class="l2"
          />
          <rect
            x="3"
            y="18"
            width="11"
            height="11"
            rx="3.5"
            class="l3"
          />
          <rect
            x="18"
            y="18"
            width="11"
            height="11"
            rx="3.5"
            class="l4"
          />
          <path
            d="M14 8.5h4M8.5 14v4M23.5 14v4M14 23.5h4"
            class="lw"
          />
        </svg>
        <div class="brand-text"><b>Ork</b><span>Roadmap</span></div>
      </a>

      <nav
        class="rm-tabs"
        aria-label="Views"
      >
        <a
          href="#roadmap"
          data-view="roadmap"
          >Roadmap</a
        >
        <a
          href="#timeline"
          data-view="timeline"
          >Timeline</a
        >
      </nav>

      <div class="rm-tools">
        <a
          class="btn"
          href="index.html"
          >Interaction map</a
        >
        <button
          id="theme-btn"
          class="icon-btn"
          aria-label="Toggle light and dark"
          title="Theme (T)"
        >
          <svg
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <circle
              cx="8"
              cy="8"
              r="5.5"
            />
            <path
              class="fill"
              d="M8 2.5a5.5 5.5 0 0 1 0 11z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="rm-scroll"
      class="rm-scroll"
    >
      <main class="rm-main">
        <section
          class="rm-summary"
          aria-label="Progress"
        >
          <div class="rm-headline">
            <h1>Where Ork is</h1>
            <p
              id="rm-now"
              class="rm-now"
            ></p>
          </div>
          <div
            id="rm-overall"
            class="rm-overall"
          ></div>
          <ol
            id="rm-strip"
            class="rm-strip"
          ></ol>
          <ul
            id="rm-legend"
            class="rm-legend"
          ></ul>
        </section>

        <section
          id="view-roadmap"
          class="rm-view"
          aria-label="Roadmap"
        ></section>
        <section
          id="view-timeline"
          class="rm-view"
          aria-label="Timeline"
          hidden
        ></section>

        <footer
          id="rm-footer"
          class="rm-footer"
        ></footer>
      </main>
    </div>
  </body>
</html>
