version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Same 7-day cooldown as `minimumReleaseAge` in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @types/node tracks the Node major Ork runs on (engines: >=24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
