name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No job gets a token unless it asks for one below.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run docs:check

  # The published CLI: build the bundle, run it, and check the tarball.
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: node packages/cli/dist/bin.mjs validate examples
      - run: npm pack --dry-run
        working-directory: packages/cli

  # A pull request that changes shipped code adds a changeset. The release
  # pull request itself (changeset-release/main) consumes them, so it is
  # exempt.
  changeset:
    name: changeset
    if:
      github.event_name == 'pull_request' && github.head_ref !=
      'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Node 24 runs the TypeScript check directly.
      - uses: ./.github/actions/setup
      - run: node tools/release/check-changeset.ts origin/${{ github.base_ref }}

  map:
    name: interaction map
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check lists the commits since the last sync.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm run map:check

  # On a push to main, once every gate above has passed: open or update the
  # "chore: release" pull request while changesets are pending, and publish when
  # that pull request is merged (none left). The gates are the jobs it needs,
  # so the checks run once per push.
  release:
    name: release
    # Only the main repository releases, only from a push to main; forks never publish.
    if:
      github.repository == 'mimshins/ork' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [format, lint, typecheck, unit, docs, package, map]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Releases run one at a time, in push order; canary.yml shares the group.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the release commit, tags and GitHub releases
      pull-requests: write # the "chore: release" pull request
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # changesets/action pushes through the GitHub API with its own token.
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "chore: release"
          commit-message: "chore: release"
          version-script: pnpm run changesets:version
          publish-script: pnpm run release
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
