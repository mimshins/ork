<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Ork">
  <title>Ork</title>
  <defs>
    <radialGradient id="ork-scan-screen" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#112016"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </radialGradient>
    <filter id="ork-scan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ork-scan-scan" width="4" height="2.5" patternUnits="userSpaceOnUse">
      <rect width="4" height="0.8" fill="#000" opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ork-scan-screen)"/>
  <g filter="url(#ork-scan-glow)" stroke-linecap="round" stroke-width="6">
    <path d="M 14 16 H 36" stroke="#ffb000"/>
    <path d="M 24 27 H 50" stroke="#3dff8a"/>
    <path d="M 24 38 H 42" stroke="#3dff8a"/>
    <path d="M 34 49 H 50" stroke="#24a85a"/>
  </g>
  <rect width="64" height="64" rx="14" fill="url(#ork-scan-scan)"/>
</svg>
