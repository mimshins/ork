# yaml-language-server: $schema=https://raw.githubusercontent.com/mimshins/ork/main/packages/schema/workflow.schema.json
schemaVersion: 1
name: feature
description: From a brief to a change you keep or discard. The spec-writer drafts a task spec and revises it until you approve it; a leader builds it through the ui-designer, a11y-auditor, implementer or engine agent; an independent reviewer sends findings back in a bounded loop; the docs-keeper syncs the knowledge; then you choose to commit and push to main, commit and push to a branch with a pull request, keep it uncommitted, or discard it. Nothing is committed before that.
inputs:
  brief:
    type: string
    required: true
    description: The requirements in your own words, short. The spec-writer turns them into a task spec for you to approve.
layers:
  project:
    instructions: inherit
    skills:
      allow:
        - knowledge-drift-sync
        - resync-map
        - docs-structure
defaults:
  model: sonnet
  effort: medium
  budgetUsd: 2
limits:
  budgetUsd: 35
  concurrency: 4
  timeout: 5h
nodes:
  spec:
    type: claude.worker
    agent: spec-writer
    prompt: |-
      Write the task spec for this brief:

      {{inputs.brief}}

      When you run again, the next message is the maintainer's answer to the approval gate: choice revise, and note, their words on what to change. Revise the spec as they say and report all of it again. If the note is empty, ask with ask_user what to change rather than guessing.
    model: sonnet
    effort: high
    isolation: readonly
    budgetUsd: 2
    maxTurns: 40
    session: resume
    output:
      schema:
        decisions:
          type: array
          description: Every choice settled in the approval loop, as in the spec's Decided section; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
        spec: string
  approve:
    type: human.gate
    question: |-
      Approve this task spec? The build starts on approve, and is paid.

      Open questions: {{nodes.spec.output.summary}}

      Read the spec with Read document. To request changes, answer revise with a note saying what to change: the note goes to the spec-writer as it is. stop ends the run with nothing built.
    document: "{{nodes.spec.output.spec}}"
    options:
      - approve
      - revise
      - stop
  build:
    type: claude.leader
    prompt: |-
      Build this approved task spec through the agents you own. Decide what it needs:
      - UI work (packages/ui): delegate to design first, then the build, then a11y to audit the result.
      - Engine work (scheduler, runtime port and drivers, store and events, run control, replay): delegate the build to engine; anything else to implement.

      Build in waves, following each task's dependencies and files in the spec. Shared contracts (schema, types) go first, as their own wave. Then send each wave as exactly one tool call, so its tasks run at once: your calls run one after another, so a `delegate` and a `spawn_worker` sent together do not overlap. Use `delegate` when each builder in the wave has one task, and otherwise one `spawn_worker` call for the whole wave, naming each task's builder as its template, since a child that is already running refuses another task. Tasks in one wave must not touch the same files, and each must pass pnpm check without another task of its wave. Files everyone appends to (index.ts exports, generated schemas, specs, gaps ids, roadmap data) belong to one task or a last wave. Run tasks together in one builder when they are small or share files: every builder is a new session and a full pnpm check, so split only substantial work. A merge conflict in a child's report is yours to resolve.

      Each child already has the spec; your brief says which tasks are theirs. Fix only what integrates their work. Ork runs pnpm check on your checkout before your report counts. When you run again, your input is an independent review's findings: delegate the fixes. When a child asks a question, answer it only when the approved spec or an earlier answer settles it, and say which; otherwise pass it to the maintainer. Never decide for them. Say in `unchecked` what no child and no check covered (an empty string when nothing). Report pass only when every child you used passed, and gather the spec's decisions and every decision your children reported into your own `decisions`, keeping who decided each.

      {{nodes.spec.output.spec}}
    model: sonnet
    effort: high
    isolation: worktree
    budgetUsd: 4
    maxTurns: 60
    timeout: 3h
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        decisions:
          type: array
          description: Every decision of the spec and of each child you used, gathered, with its decidedBy kept; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
        unchecked: string
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 1
    maxWorkers: 8
    questions: owner
  design:
    type: claude.worker
    parent: build
    agent: ui-designer
    prompt: |-
      Design the UI part of this task before it is coded, as your owner's brief says. Write the design (purpose, states, tokens, keyboard map, accessible names, copy word for word) into specs/ui/ and any new tokens into packages/ui/src/design/, with their pairings in packages/ui/test/pairings.ts. Write no feature code. Report every choice you made that the spec didn't settle in `decisions`. The approved task spec:

      {{nodes.spec.output.spec}}
    model: sonnet
    effort: high
    isolation: worktree
    budgetUsd: 3
    maxTurns: 40
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the spec didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    mcp:
      - chrome-devtools
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
  a11y:
    type: claude.worker
    parent: build
    agent: a11y-auditor
    prompt: Audit the uncommitted UI change in your owner's checkout (git status, git diff HEAD) against WCAG 2.2 AA. Open the changed surfaces in the browser tools for axe, a keyboard pass, zoom and contrast, and audit the changed components' markup, names and roles, focus handling, keyboard map, tokens and their contrast pairings, and run the UI's tests (npx vitest run packages/ui). Report pass, or changes_requested with every finding in `findings` (surface, criterion, how it fails, the fix), and list anything you couldn't check. In Bash keep to plain read commands (cat, head, tail, wc, ls, grep, rg, sed -n, cut, sort, uniq, echo, read-only git), the tests and pnpm install --offline, with no awk, find, python, shell variables, brace expansion or paths outside this checkout, and write no files, not even a temporary test. Anything else stops the run to ask the maintainer. What needs more than that goes in the list of what you couldn't check.
    model: sonnet
    isolation: readonly
    budgetUsd: 2
    maxTurns: 40
    tools:
      allow:
        - Bash(pnpm install --offline *)
    session: resume
    output:
      schema:
        findings: string
    mcp:
      - chrome-devtools
  implement:
    type: claude.worker
    parent: build
    agent: implementer
    prompt: |-
      Build the tasks your owner's brief gives you from this approved task spec. If a design is in your checkout (git status), build to it. Report every choice you made that the spec didn't settle in `decisions`. Ork runs pnpm check before your report counts.

      {{nodes.spec.output.spec}}
    effort: high
    isolation: worktree
    budgetUsd: 6
    maxTurns: 80
    timeout: 90m
    tools:
      allow:
        - Edit
        - Write
        - Bash
    session: resume
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the spec didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 2
  engine:
    type: claude.worker
    parent: build
    agent: engine
    prompt: |-
      Build the tasks your owner's brief gives you from this approved task spec. If it leaves the engine's semantics open, report fail and say what is open rather than choosing. If a design is in your checkout (git status), build to it. Report every choice you made that the spec didn't settle in `decisions`. Ork runs pnpm check before your report counts.

      {{nodes.spec.output.spec}}
    model: opus
    effort: high
    isolation: worktree
    budgetUsd: 8
    maxTurns: 80
    timeout: 90m
    tools:
      allow:
        - Edit
        - Write
        - Bash
    session: resume
    output:
      schema:
        decisions:
          type: array
          description: Every choice you made that the spec didn't settle; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - what
              - why
              - decidedBy
              - hardToReverse
            properties:
              what:
                type: string
              why:
                type: string
              decidedBy:
                type: string
                description: Who decided it - maintainer, or the node id.
              hardToReverse:
                type: boolean
                description: True when AGENTS.md says it needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency).
              date:
                type: string
                description: YYYY-MM-DD.
              alternatives:
                type: array
                items:
                  type: string
    before:
      command: pnpm install --frozen-lockfile --prefer-offline
      timeout: 10m
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 2
  review:
    type: claude.worker
    agent: reviewer
    prompt: |-
      Review the uncommitted change in this checkout (git status, git diff HEAD) against the approved task spec below. pnpm check already passed here; don't run it again. Report pass, or changes_requested with every finding in `findings` (file:line, what is wrong, the smallest fix), most severe first. Say in `unchecked` what you could not check or chose not to (an empty string when nothing). When you run again, check that your earlier findings were fixed.

      Read files with Read and search with Grep. When you do use Bash, keep to cat, head, tail, wc, ls, grep, rg, sed -n, cut, sort, uniq, echo, npm view and read-only git, with no awk, no find, no shell variables, no brace expansion and no paths outside this checkout: anything else stops the run to ask the maintainer.

      {{nodes.spec.output.spec}}
    model: opus
    effort: high
    isolation: readonly
    budgetUsd: 2.5
    maxTurns: 40
    session: resume
    output:
      schema:
        findings: string
        unchecked: string
  docs:
    type: claude.worker
    agent: docs-keeper
    prompt: |-
      The change in this checkout (git status, git diff HEAD) passed review. Sync the knowledge with it: run knowledge-drift-sync, resync-map when it changes what the map shows, and docs-structure for any document over 200 lines.

      Then write an ADR in decisions/ for each decision below with hardToReverse true, from .ai/templates/adr.md: the next free number, a row in decisions/README.md's index, and links to the specs under specs/ that carry it (the task spec is gitignored, so don't link it). Related decisions may share one ADR; a decision listed twice is one. List every ADR you wrote in `adrs`, an empty list when none.

      Make sure the change has a changeset in .changeset/ (a Markdown file naming the bump for @krapht/ork and a changelog line; `pnpm changesets:empty` for internal-only work), and add one if it doesn't. A commit step refuses a change without one.

      Then write the commit message for the whole change: `commitSubject`, a short imperative subject with no prefix (like "Let Claude nodes name the MCP servers they load"), and `commitBody`, what changed and why in a few lines. No AI or agent attribution. Ork runs pnpm check before your report counts.

      The spec's decisions: {{nodes.spec.output.decisions}}
      The build's decisions: {{nodes.build.output.decisions}}

      The approved task spec:

      {{nodes.spec.output.spec}}
    isolation: continue
    budgetUsd: 2
    maxTurns: 60
    practices:
      caveman: false
    tools:
      allow:
        - Edit
        - Write
        - Bash
    output:
      schema:
        commitSubject: string
        commitBody: string
        adrs:
          type: array
          description: Every ADR you wrote; an empty list when none.
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - path
            properties:
              title:
                type: string
              path:
                type: string
    verify:
      command: pnpm check
      timeout: 20m
      attempts: 1
  stage:
    type: tool.git
    command: add -A
    allow:
      - add
    cwd: "{{nodes.docs.output.worktree}}"
  decide:
    type: human.gate
    question: |-
      Where does this change go? Nothing is committed yet.

      - main: commit it and push to main.
      - branch: commit it, push to the branch your note names (no note: ork/<run>) and open a pull request to main.
      - keep-uncommitted: apply it to your checkout for you to commit.
      - discard: leave it in the worktree (ork worktrees remove <run>/<node> --force removes it).

      Read the document for what was built, the review, and the commit message.
    document: |-
      ## What was built

      {{nodes.build.output.summary}}

      Docs: {{nodes.docs.output.summary}}

      Worktree: {{nodes.docs.output.worktree}}

      ## Review

      Verdict: {{nodes.review.output.status}}

      {{nodes.review.output.summary}}

      Left open: {{nodes.review.output.findings}}

      ## What wasn't checked

      Build: {{nodes.build.output.unchecked}}

      Review: {{nodes.review.output.unchecked}}

      ## ADRs

      Check these before you keep the change:

      {{nodes.docs.output.adrs}}

      ## Commit message

      {{nodes.docs.output.commitSubject}}

      {{nodes.docs.output.commitBody}}

      ## Files changed

      {{nodes.stage.output.staged}}
    options:
      - main
      - branch
      - keep-uncommitted
      - discard
  publish:
    type: tool.shell
    script: |-
      set -eu
      if [ "$CHOICE" = main ]; then
        branch=main
      else
        branch="$(printf %s "$NOTE" | tr -d '[:space:]')"
        branch="${branch:-ork/$RUN}"
      fi
      if ! git check-ref-format --branch "$branch" > /dev/null 2>&1; then
        echo "'$branch' is not a valid branch name. The change is still in $WORKTREE." >&2
        exit 1
      fi
      if [ "$CHOICE" = branch ] && [ "$branch" = main ]; then
        echo "Choose main to push to main; branch opens a pull request from another branch." >&2
        exit 1
      fi
      # Already committed when an earlier try stopped at the rebase or the push.
      if ! git -C "$WORKTREE" diff --cached --quiet; then
        if ! git -C "$WORKTREE" diff --cached --name-only --diff-filter=AM -- .changeset | grep -q '\.md$'; then
          echo "No changeset in this change. Add one in $WORKTREE (pnpm changesets:create or changesets:empty), stage it, and resume." >&2
          exit 1
        fi
        printf '%s\n\n%s\n' "$SUBJECT" "$BODY" | git -C "$WORKTREE" commit -F -
      fi
      base=main
      if git -C "$WORKTREE" ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
        base="$branch"
      fi
      git -C "$WORKTREE" fetch origin "$base"
      if ! git -C "$WORKTREE" rebase FETCH_HEAD; then
        git -C "$WORKTREE" rebase --abort
        echo "The change conflicts with origin/$base. It is committed in $WORKTREE; rebase it there and push." >&2
        exit 1
      fi
      git -C "$WORKTREE" push origin "HEAD:refs/heads/$branch"
      if [ "$CHOICE" = branch ]; then
        if gh pr view "$branch" > /dev/null 2>&1; then
          echo "$branch already has a pull request; it is updated."
        else
          gh pr create --base main --head "$branch" --title "$SUBJECT" --body "$BODY"
        fi
      elif [ "$(git branch --show-current)" = main ] && [ -z "$(git status --porcelain)" ]; then
        git fetch origin main
        git merge --ff-only FETCH_HEAD
      else
        echo "Pushed to main. Your checkout has other work or another branch, so it was left alone: git pull when ready."
      fi
    allow:
      - sh
    env:
      CHOICE: "{{nodes.decide.output.choice}}"
      NOTE: "{{nodes.decide.output.note}}"
      RUN: "{{run.id}}"
      SUBJECT: "{{nodes.docs.output.commitSubject}}"
      BODY: "{{nodes.docs.output.commitBody}}"
      WORKTREE: "{{nodes.docs.output.worktree}}"
  apply:
    type: tool.shell
    script: |-
      patch="$(mktemp)"
      git -C "$WORKTREE" diff --cached --binary > "$patch"
      git apply --check "$patch"
      git apply "$patch"
      git apply --stat "$patch"
      rm -f "$patch"
    allow:
      - sh
    env:
      WORKTREE: "{{nodes.docs.output.worktree}}"
edges:
  - spec -> approve
  - from: approve
    to: spec
    when: choice == 'revise'
    maxRounds: 10
  - from: approve
    to: build
    when: choice == 'approve'
  - build -> review
  - from: review
    to: build
    when: status != 'pass'
    maxRounds: 2
  - from: review
    to: docs
    when: status == 'pass'
  - docs -> stage
  - stage -> decide
  - from: decide
    to: publish
    when: choice == 'main' || choice == 'branch'
  - from: decide
    to: apply
    when: choice == 'keep-uncommitted'
