# yaml-language-server: $schema=https://raw.githubusercontent.com/mimshins/ork/main/packages/schema/workflow.schema.json
schemaVersion: 1
name: feature
description: From a brief to a change you keep or discard, by calling the rfc, plan and build workflows. It reads the code and recommends a route, and you choose whether the brief needs an RFC first. Each called workflow asks you its decisions in ork decide or the Decisions panel of ork ui, and each also runs alone.
inputs:
  brief:
    type: string
    required: true
    description: The requirements in your own words, short.
layers:
  project:
    instructions: inherit
defaults:
  model: sonnet
  effort: medium
  budgetUsd: 1
limits:
  budgetUsd: 55
  concurrency: 1
  timeout: 72h
nodes:
  frame:
    type: claude.worker
    prompt: |-
      Read what this brief touches: the specs under specs/ that govern it, the ADRs they cite, and the code it changes. Change nothing.

      List the design decisions it leaves open: anything AGENTS.md says needs an ADR (a package boundary, the workflow format, the runtime port, a cross-cutting pattern, a new runtime dependency) or that changes what users see. Then recommend a route in `recommendation`: rfc when one of them has real alternatives worth weighing in a durable document, plan otherwise. Put the list and your reason, citing files, in `analysis`, as markdown. The maintainer chooses the route; don't start on either.

      {{inputs.brief}}
    effort: high
    isolation: readonly
    maxTurns: 30
    output:
      schema:
        recommendation:
          - plan
          - rfc
        analysis: string
  route:
    type: human.gate
    question: |-
      Which route for this brief? Recommended: {{nodes.frame.output.recommendation}}.

      - plan: go straight to a plan; its open decisions are asked one at a time.
      - rfc: weigh the options in an RFC first and publish it. Publishing to main goes on to the plan; a branch ends here, for its pull request.
      - stop: end the run.

      Read the document for the open decisions and the reason.
    document: "{{nodes.frame.output.analysis}}"
    options:
      - plan
      - rfc
      - stop
  rfc:
    type: workflow.call
    workflow: rfc
    inputs:
      brief: "{{inputs.brief}}"
    timeout: 24h
  plan:
    type: workflow.call
    workflow: plan
    inputs:
      brief: "{{inputs.brief}}"
      rfc: "{{nodes.rfc.output.outputs.rfc}}"
    timeout: 24h
  next:
    type: human.gate
    question: |-
      The plan is approved. What now?

      - build-now: start the build, which is paid.
      - save-plan: write it to .ai/plans/ (local, never committed). Build it later with ork run build --input plan="$(cat <file>)".
      - stop: end the run.
    document: "{{nodes.plan.output.outputs.plan}}"
    options:
      - build-now
      - save-plan
      - stop
  save:
    type: tool.shell
    script: |-
      mkdir -p .ai/plans
      out=".ai/plans/$RUN.md"
      printf '%s\n' "$PLAN" > "$out"
      echo "$out"
    allow:
      - sh
    env:
      RUN: "{{run.id}}"
      PLAN: "{{nodes.plan.output.outputs.plan}}"
  build:
    type: workflow.call
    workflow: build
    inputs:
      plan: "{{nodes.plan.output.outputs.plan}}"
    timeout: 24h
edges:
  - frame -> route
  - from: route
    to: rfc
    when: choice == 'rfc'
  - from: route
    to: plan
    when: choice == 'plan'
  - from: rfc
    to: plan
    when: outputs.choice == 'main'
  - from: plan
    to: next
    when: outputs.choice == 'approve'
  - from: next
    to: build
    when: choice == 'build-now'
  - from: next
    to: save
    when: choice == 'save-plan'
